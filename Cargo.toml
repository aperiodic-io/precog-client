[package]
name = "precog-client"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust SDK for Precog: producers with dedup keys, readers with cursors valid on every node"
repository = "https://github.com/aperiodic-io/precog-client"
rust-version = "1.97"

[dependencies]
anyhow = "1"
bytes = "1"
crc32c = "0.6"
futures = "0.3"
lz4_flex = { version = "0.13", default-features = false, features = ["std"] }
parking_lot = "0.12"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[features]
# A Precog cluster in Docker for tests (`testkit`): the published node image, nodes stopped and
# started at will.
testkit = []

[dev-dependencies]
precog-client = { path = ".", features = ["testkit"] }
proptest = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
